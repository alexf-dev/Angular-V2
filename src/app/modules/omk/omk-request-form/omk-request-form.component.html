<div class="flex flex-column gap-4">
  <div class="flex justify-content-center" *ngIf="patient">
    <app-radio-group-field
      [options]="requestTypeOptions"
      [value]="reExaminationAppealDto.isAppeal"
      (valueChange)="reExaminationAppealDto.isAppeal = $event"
      [disabled]="isViewMode || isLoading"
      layout="horizontal">
    </app-radio-group-field>
  </div>

  <app-multi-select-field
    labelKey="OMK.REEXAMINATION.COMPLAINTS"
    [required]="true"
    [options]="appealStatuses"
    optionValue="id"
    optionLabel="nameRu"
    [dictionaryMode]="true"
    [value]="selectedComplaintIds"
    (valueChange)="onComplaintChange($event)"
    [disabled]="isViewMode || isLoading"
    placeholderKey="COMMON.CHOOSE">
  </app-multi-select-field>

  <app-textarea-field
    labelKey="OMK.COMPLAINTS_PATIENT"
    [value]="reExaminationAppealDto.notes"
    (valueChange)="reExaminationAppealDto.notes = $event"
    [rows]="2"
    placeholderKey="OMK.REEXAMINATION.WRITE"
    [disabled]="isViewMode || isLoading">
  </app-textarea-field>

  <app-textarea-field
    *ngIf="patient"
    labelKey="OMK.OBJECTIVE_EXAMINATION"
    [value]="reExaminationAppealDto.objectiveExamination"
    (valueChange)="reExaminationAppealDto.objectiveExamination = $event"
    [rows]="2"
    placeholderKey="OMK.REEXAMINATION.WRITE"
    [disabled]="isViewMode || isLoading">
  </app-textarea-field>

  <app-textarea-field
    *ngIf="patient"
    labelKey="OMK.ADDITIONAL_LAB_DATA"
    [value]="reExaminationAppealDto.additionalLabData"
    (valueChange)="reExaminationAppealDto.additionalLabData = $event"
    [rows]="2"
    placeholderKey="OMK.REEXAMINATION.WRITE"
    [disabled]="isViewMode || isLoading">
  </app-textarea-field>

  <app-textarea-field
    *ngIf="patient"
    labelKey="OMK.CONCLUSION_RECOMMENDATIONS"
    [value]="reExaminationAppealDto.conclusionRecommendations"
    (valueChange)="reExaminationAppealDto.conclusionRecommendations = $event"
    [rows]="2"
    placeholderKey="OMK.REEXAMINATION.WRITE"
    [disabled]="isViewMode || isLoading">
  </app-textarea-field>

  <div class="flex justify-content-center gap-5">
    <div class="w-full">
      <app-date-field
        labelKey="OMK.REEXAMINATION.LETTER_RECEIVED_DATE"
        [value]="reExaminationAppealDto.dateReceipt"
        (valueChange)="reExaminationAppealDto.dateReceipt = $event"
        dateFormat="dd.mm.yy"
        [maxDate]="maxSelectableDate"
        [readonlyInput]="true"
        [disabled]="isViewMode || isLoading">
      </app-date-field>
    </div>

    <div class="w-full">
      <app-text-input-field
        labelKey="OMK.REEXAMINATION.INCOMING_LETTER_NUMBER"
        [value]="reExaminationAppealDto.incomingLetterNo"
        (valueChange)="reExaminationAppealDto.incomingLetterNo = $event"
        placeholderKey="OMK.REEXAMINATION.INCOMING_LETTER_NUMBER"
        [disabled]="isViewMode || isLoading">
      </app-text-input-field>
    </div>
  </div>

  <app-file-upload-field
    labelKey="OMK.REEXAMINATION.ATTACH_EOTINISH_FILE"
    [required]="true"
    accept=".pdf, application/pdf"
    [maxSize]="0"
    [fileName]="selectedFileName"
    [disabled]="isViewMode || isLoading"
    (fileSelect)="onFileSelectShared($event)"
    (fileRemove)="removeFileShared()">
  </app-file-upload-field>

  <div class="flex justify-content-between align-items-center gap-5">
    <div class="flex align-items-center gap-2" *ngIf="isLoading || isViewMode">
      <label class="font-semibold">
        {{ 'OMK.REEXAMINATION.STATUS_LABEL' | translate }}:
      </label>
      <p-tag
        [value]="reExaminationAppealDto.status | translateDictionary"
        severity="info">
      </p-tag>
    </div>

    <button
      pButton
      type="button"
      label="{{ 'OMK.REEXAMINATION.SEND' | translate }}"
      class="p-button-success ml-auto"
      (click)="submitMock()"
      [disabled]="((isLoading || isViewMode || !(selectedComplaintIds.length > 0) || !reExaminationAppealDto.isAppeal) && patient) || ((isLoading || isViewMode || !(selectedComplaintIds.length > 0)) && resolution)">
    </button>
  </div>
</div>
