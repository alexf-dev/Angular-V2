<div class="iin-request-wrapper">
  <div class="icon-circle">
    <i class="pi pi-user"></i>
  </div>

  <p class="iin-request-text">
    По указанному ИИН или ФИО не найдено данных в базе АИС ЦБДИ.<br />
    Вы можете отправить запрос в ГБдФЛ, для этого введите ИИН для получения информации.
  </p>

  <div class="iin-request-row">
    <div class="iin-input-holder">
      <app-text-input-field
        [value]="iin"
        (valueChange)="iin = $event"
        [digitsOnly]="true"т
        placeholder="Введите ИИН">
      </app-text-input-field>
    </div>

    <button
      pButton
      type="button"
      label="Отправить запрос"
      icon="pi pi-send"
      [disabled]="disabled"
      (click)="send()">
    </button>
  </div>
</div>
