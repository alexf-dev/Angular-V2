<div class="grid">
  <div class="col-12">
    <p-card styleClass="mb-4">
      <ng-template pTemplate="title">Поиск пациента</ng-template>

      <div class="formgrid grid">
        <div class="field col-12 md:col-3">
          <app-text-input-field
            label="Имя"
            [value]="personFilter.firstname"
            (valueChange)="personFilter.firstname = $event"
            placeholder="ИМЯ">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-3">
          <app-text-input-field
            label="Фамилия"
            [value]="personFilter.surname"
            (valueChange)="personFilter.surname = $event"
            placeholder="ФАМИЛИЯ">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-3">
          <app-text-input-field
            label="ИИН"
            [value]="personFilter.iin"
            (valueChange)="personFilter.iin = $event"
            placeholder="ИИН">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-3">
          <app-dropdown-field
            label="Регион"
            [options]="regions"
            optionValue="id"
            optionLabel="nameRu"
            [value]="personFilter.regionId"
            (valueChange)="personFilter.regionId = $event"
            [fullWidth]="false"
            placeholder="Регион">
          </app-dropdown-field>
        </div>
      </div>

      <div class="flex flex-column md:flex-row gap-3 align-items-start md:align-items-center mb-4">
        <app-check-field
          label="Срок прошел"
          [checked]="personFilter.expired"
          (checkedChange)="personFilter.expired = $event">
        </app-check-field>

        <app-check-field
          label="Умершие"
          [checked]="personFilter.dead"
          (checkedChange)="personFilter.dead = $event">
        </app-check-field>

        <app-check-field
          label="Выживавшие"
          [checked]="personFilter.survived"
          (checkedChange)="personFilter.survived = $event">
        </app-check-field>
      </div>

      <div class="flex gap-2">
        <button
          pButton
          type="button"
          label="Поиск"
          icon="pi pi-search"
          (click)="filter(personFilter)"
          class="p-button-success">
        </button>

        <button
          pButton
          type="button"
          label="Сбросить"
          icon="pi pi-refresh"
          class="p-button-secondary"
          (click)="resetFilter()">
        </button>
      </div>
    </p-card>
  </div>

  <div class="col-12">
    <p-card>
      <ng-template pTemplate="title">
        <div class="flex justify-content-between align-items-center w-full">
          <span>Результат поиска</span>
          <span class="text-primary font-bold">{{ patients?.length || 0 }}</span>
        </div>
      </ng-template>

      <app-data-table
        [data]="visiblePatients"
        [columns]="columns"
        [pageSize]="pageSize"
        [totalRecords]="totalRecords"
        [currentPage]="page"
        [showActions]="true"
        [actions]="actions"
        actionsHeader="Действия"
        totalLabel="Всего записей"
        emptyMessage="Пациенты не найдены"
        (pageChange)="onPageChange($event)"
        (actionClick)="onActionClick($event)">
      </app-data-table>
    </p-card>
  </div>

  <div class="col-12" *ngIf="patients?.length === 0 && !isFromOmk">
    <app-iin-request-empty (requestIin)="onIinRequest($event)"></app-iin-request-empty>
  </div>
</div>

<ng-template #statusTemplate let-row>
  <p-tag
    *ngIf="row.personStatus"
    [value]="row.personStatus.nameRu"
    [severity]="getStatusSeverity(row.personStatus.nameRu)">
  </p-tag>
</ng-template>
