<div class="grid">
  <div class="col-12">

    <p-card styleClass="mb-4">
      <ng-template pTemplate="title">
        {{ 'APPROVAL_JOURNAL.TITLE' | translate }}
      </ng-template>

      <div class="formgrid grid">
        <div class="field col-12 md:col-3">
          <app-text-input-field
            labelKey="COMMON.IIN"
            placeholderKey="COMMON.IIN">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-3">
          <app-dropdown-field
            labelKey="COMMON.STATUS"
            [options]="statusOptions"
            optionValue="id"
            optionLabel="nameRu"
            [dictionaryMode]="true"
            placeholderKey="COMMON.STATUS">
          </app-dropdown-field>
        </div>

        <div class="field col-12 md:col-3">
          <app-date-field
            labelKey="COMMON.DATE_FROM"
            dateFormat="dd.mm.yy">
          </app-date-field>
        </div>

        <div class="field col-12 md:col-3">
          <app-date-field
            labelKey="COMMON.DATE_TO"
            dateFormat="dd.mm.yy">
          </app-date-field>
        </div>
      </div>

      <div class="flex gap-2">
        <button
          pButton
          type="button"
          [label]="'COMMON.SEARCH' | translate"
          icon="pi pi-search"
          class="p-button-success"
          (click)="search()"
        ></button>

        <button
          pButton
          type="button"
          [label]="'COMMON.CLEAR' | translate"
          icon="pi pi-refresh"
          class="p-button-secondary"
          (click)="clear()"
        ></button>
      </div>
    </p-card>
  </div>

  <div class="col-12">
    <p-card>
      <ng-template pTemplate="title">
        <div class="flex justify-content-between align-items-center w-full">
          <span>Результат поиска </span>
          <span class="text-primary font-bold">{{ pageResponse?.total || 0 }}</span>
        </div>
      </ng-template>

      <app-data-table
        [data]="journalApprovalResponse"
        [columns]="columns"
        [pageSize]="approvalLogFilter.pageSize"
        [totalRecords]="pageResponse?.total || 0"
        [currentPage]="approvalLogFilter.pageNum"
        [rowsPerPageOptions]="rowsPerPageOptions"
        [showActions]="false"
        [totalLabel]="''"
        [totalLabelKey]="''"
        [emptyMessage]="'COMMON.NOT_FOUND2' | translate"
        (pageChange)="onPageChange($event)">
      </app-data-table>

      <p-confirmDialog></p-confirmDialog>
    </p-card>
  </div>

  <p-dialog
    header="Подтверждение подписи"
    [(visible)]="cameraVisible"
    [modal]="true"
    [style]="{ width: '420px', maxWidth: '95vw' }"
    (onShow)="onCameraDialogShow()"
    (onHide)="onCameraDialogHide()"
  >
    <div class="camera-wrapper">
      <video
        #video
        autoplay
        playsinline
        [hidden]="!!photoDataUrl"
        class="camera-video"
      ></video>

      <img
        *ngIf="photoDataUrl"
        [src]="photoDataUrl"
        class="camera-photo-preview"
      />

      <canvas #canvas class="hidden-canvas"></canvas>

      <div class="camera-buttons">
        <button
          pButton
          type="button"
          label="Сделать фото"
          icon="pi pi-camera"
          (click)="takePhoto()"
          [disabled]="!stream"
        ></button>

        <button
          *ngIf="photoDataUrl"
          pButton
          type="button"
          label="Снять заново"
          icon="pi pi-refresh"
          class="p-button-secondary"
          (click)="retakePhoto()"
        ></button>

        <button
          pButton
          type="button"
          label="Отправить"
          icon="pi pi-check"
          class="p-button-success"
          (click)="sendPhoto()"
          [disabled]="!photoDataUrl || loading"
        ></button>
      </div>
    </div>
  </p-dialog>

</div>

<ng-template #birthDateTemplate let-row>
  {{ (row?.birthDate | date:'dd.MM.yyyy') || '-' }}
</ng-template>

<ng-template #conditionTemplate let-row>
  {{ getCondition(row.conditionKz, row.conditionRu) }}
</ng-template>

<ng-template #beginDateTemplate let-row>
  {{ (row?.beginDate | date:'dd.MM.yyyy') || '-' }}
</ng-template>

<ng-template #createDateTemplate let-row>
  {{ (row?.createDate | date:'dd.MM.yyyy') || '-' }}
</ng-template>

<ng-template #actionsTemplate let-row>
  <div class="flex align-items-center gap-2">
    <button
      *ngIf="(authService.hasAction('MSE_EDIT') &&(row.statusId === 2111 || row.statusId === 2113)) ||
      (authService.hasAction('MSE_HEAD_EDIT') && row.statusId === 2114)"
      pButton
      type="button"
      label="Подписать"
      icon="pi pi-pencil"
      (click)="selectSignType(row)">
    </button>

    <button
      *ngIf="authService.hasAction('MSE_HEAD_EDIT') && row.statusId === 15198"
      pButton
      type="button"
      label="Верификация"
      icon="pi pi-camera"
      (click)="openPhotoVerification(row)">
    </button>
  </div>
</ng-template>
