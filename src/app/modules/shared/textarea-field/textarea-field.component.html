<div class="input-field-row" [class.input-field-row--stacked]="stacked">
  <label
    *ngIf="labelKey"
    [class.required]="required">
    {{ labelKey | translate }}
  </label>

  <textarea
    *ngIf="control; else ngModelTextarea"
    pInputTextarea
    [formControl]="$any(control)"
    [rows]="rows"
    [placeholder]="getDisplayPlaceholder()">
  </textarea>

  <ng-template #ngModelTextarea>
    <textarea
      [id]="inputId"
      pInputTextarea
      [disabled]="disabled"
      [rows]="rows"
      [ngModel]="value"
      (ngModelChange)="onValue($event)"
      [placeholder]="getDisplayPlaceholder()">
    </textarea>
  </ng-template>
</div>
