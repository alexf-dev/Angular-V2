<div class="check-field-wrapper">
  <div class="check-container">
    <p-checkbox
      *ngIf="control; else ngModelCheckbox"
      [inputId]="inputId"
      [binary]="true"
      [formControl]="$any(control)">
    </p-checkbox>

    <ng-template #ngModelCheckbox>
      <p-checkbox
        [inputId]="inputId"
        [binary]="true"
        [ngModel]="checked"
        (ngModelChange)="onChecked($event)"
        [disabled]="disabled">
      </p-checkbox>
    </ng-template>

    <label [for]="inputId" class="check-label">
      <ng-container *ngIf="label">{{ label }}</ng-container>
      <ng-container *ngIf="labelKey && !label">{{ labelKey | translate }}</ng-container>
    </label>
  </div>

  <div *ngIf="showComment" class="comment-container">
    <input
      type="text"
      pInputText
      [ngModel]="comment"
      (ngModelChange)="onComment($event)"
      [disabled]="disabled"
      placeholder="Комментарий"
      class="w-full"
    />
  </div>
</div>
