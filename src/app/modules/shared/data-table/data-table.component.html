<div class="data-table-wrapper">
  <div *ngIf="totalRecords > 0" class="table-header">
    <span class="table-total" *ngIf="totalRecords > 0 && (totalLabel || totalLabelKey)">
      <ng-container *ngIf="totalLabel">{{ totalLabel }}: </ng-container>
      <ng-container *ngIf="totalLabelKey && !totalLabel">{{ totalLabelKey | translate }}: </ng-container>
      <strong>{{ totalRecords }}</strong>
    </span>
  </div>

  <p-table
    [value]="data"
    [responsiveLayout]="'scroll'"
    styleClass="p-datatable-sm custom-data-table"
    [tableStyle]="{ 'min-width': '100%' }">

    <ng-template pTemplate="header">
      <tr>
        <th
          *ngFor="let col of columns"
          [style.width]="col.width"
          [class]="getAlignClass(col.align)">
          <ng-container *ngIf="col.header">{{ col.header }}</ng-container>
          <ng-container *ngIf="col.headerKey && !col.header">{{ col.headerKey | translate }}</ng-container>
        </th>
        <th
          *ngIf="showActions"
          [style.width]="actionsColumnWidth"
          [class]="getAlignClass(actionsAlign)">
          <ng-container *ngIf="actionsHeader">{{ actionsHeader }}</ng-container>
          <ng-container *ngIf="actionsHeaderKey && !actionsHeader">{{ actionsHeaderKey | translate }}</ng-container>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row>
      <tr (click)="onRowClick(row)" class="data-row">
        <td
          *ngFor="let col of columns"
          [class]="getAlignClass(col.align)">
          <ng-container *ngIf="col.template; else defaultCell">
            <ng-container
              *ngTemplateOutlet="col.template; context: { $implicit: row, value: getCellValue(row, col.field) }">
            </ng-container>
          </ng-container>

          <ng-template #defaultCell>
            {{ getDisplayValue(row, col) }}
          </ng-template>
        </td>

        <td *ngIf="showActions" [class]="getAlignClass(actionsAlign)">
          <div class="actions-container">
            <button
              *ngFor="let action of actions"
              pButton
              type="button"
              [icon]="action.icon"
              [label]="''"
              [severity]="action.severity || 'secondary'"
              [class]="(action.style || 'text') === 'text' ? 'p-button-text' : (action.style || 'text') === 'outlined' ? 'p-button-outlined' : ''"
              [pTooltip]="getActionTooltip(action)"
              tooltipPosition="top"
              [disabled]="!isActionAvailable(action, row)"
              (click)="$event.stopPropagation(); onActionClick(action, row)"
              class="action-button">
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="columns.length + (showActions ? 1 : 0)" class="empty-message">
          <div class="empty-content">
            <i *ngIf="showEmptyIcon" class="pi pi-inbox empty-icon"></i>
            <span class="empty-text">
              <ng-container *ngIf="emptyMessage">{{ emptyMessage }}</ng-container>
              <ng-container *ngIf="emptyMessageKey && !emptyMessage">{{ emptyMessageKey | translate }}</ng-container>
            </span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="paginator-holder">
    <p-paginator
      *ngIf="showPaginator"
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [first]="getFirst()"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [showCurrentPageReport]="true"
      [currentPageReportTemplate]="currentPageReportTemplate"
      (onPageChange)="onPageChange($event)"
      styleClass="table-paginator">
    </p-paginator>
  </div>
</div>
