<div class="grid">
  <div class="col-12">
    <div class="formgrid grid p-fluid mb-3">
      <div class="field col-12 md:col-4">
        <app-text-input-field
          label="Введите ИИН"
          [value]="searchIin"
          (valueChange)="searchIin = $event"
          placeholder="Введите ИИН">
        </app-text-input-field>
      </div>

      <div class="field col-12 md:col-2 flex align-items-end">
        <button
          (click)="requestDataByIin()"
          label="Запросить данные"
          pButton
          type="button">
        </button>
      </div>
    </div>

    <p-card>
      <ng-template pTemplate="title">
        Данные законного представителя
      </ng-template>

      <ng-container *ngIf="guardian && guardian.personId">
        <div class="formgrid grid p-fluid">
          <div class="field col-12 md:col-4">
            <app-text-input-field
              label="Фамилия"
              [value]="guardian.personId.surname"
              (valueChange)="guardian.personId.surname = $event"
              [readonly]="true">
            </app-text-input-field>
          </div>

          <div class="field col-12 md:col-4">
            <app-text-input-field
              label="Имя"
              [value]="guardian.personId.firstName"
              (valueChange)="guardian.personId.firstName = $event"
              [readonly]="true">
            </app-text-input-field>
          </div>

          <div class="field col-12 md:col-4">
            <app-text-input-field
              label="Отчество"
              [value]="guardian.personId.secondName"
              (valueChange)="guardian.personId.secondName = $event"
              [readonly]="true">
            </app-text-input-field>
          </div>
        </div>

        <div class="formgrid grid p-fluid">
          <div class="field col-12 md:col-4">
            <app-text-input-field
              label="ИИН"
              [value]="guardian.personId.iin"
              (valueChange)="guardian.personId.iin = $event"
              [readonly]="true">
            </app-text-input-field>
          </div>

          <div class="field col-12 md:col-4">
            <app-date-field
              label="Дата рождения"
              [value]="guardian.personId.birthDate"
              (valueChange)="guardian.personId.birthDate = $event"
              dateFormat="yy-mm-dd"
              [disabled]="true">
            </app-date-field>
          </div>

          <div class="field col-12 md:col-4">
            <app-dropdown-field
              labelKey="MAIN.EXAMINATION.REG_DATA.GENDER"
              [options]="dicGenders"
              optionValue="id"
              optionLabel="nameRu"
              [dictionaryMode]="true"
              [value]="guardian.personId.sex.id"
              (valueChange)="guardian.personId.sex.id = $event"
              [disabled]="true"
              placeholderKey="COMMON.CHOOSE">
            </app-dropdown-field>
          </div>
        </div>

        <div class="formgrid grid p-fluid">
          <div class="field col-12 md:col-6">
            <app-text-input-field
              label="Контактные данные из БМГ"
              [value]="guardian.phone"
              (valueChange)="guardian.phone = $event"
              [readonly]="true">
            </app-text-input-field>
          </div>

          <div class="field col-12 md:col-6">
            <app-dropdown-field
              label="Степень родства"
              [options]="dicRelativeType"
              optionValue="id"
              optionLabel="nameRu"
              [dictionaryMode]="true"
              [value]="guardian.relTypeId"
              (valueChange)="guardian.relTypeId = $event"
              placeholderKey="COMMON.CHOOSE">
            </app-dropdown-field>
          </div>
        </div>

        <div class="formgrid grid p-fluid">
          <div class="field col-12 md:col-4">
            <app-check-field
              label="Подтверждено системой «E-попечительство»"
              [checked]="guardian.isENebdApproved"
              (checkedChange)="guardian.isENebdApproved = $event"
              [disabled]="true">
            </app-check-field>
          </div>

          <div class="field col-12 md:col-4">
            <app-check-field
              label="Подтверждено системой «E-собес»"
              [checked]="guardian.isPatronizeApproved"
              (checkedChange)="guardian.isPatronizeApproved = $event"
              [disabled]="true">
            </app-check-field>
          </div>

          <div class="field col-12 md:col-4">
            <app-check-field
              label="Подтверждено системой «E-Загс»"
              [checked]="guardian.isZagsApproved"
              (checkedChange)="guardian.isZagsApproved = $event"
              [disabled]="true">
            </app-check-field>
          </div>
        </div>

        <app-identity-card
          *ngIf="guardian?.personHistoryId"
          [historyId]="guardian.personHistoryId">
        </app-identity-card>
      </ng-container>

      <div class="mt-4">
        <app-additional-documents
          [patientId]="patientId"
          [type]="'guardian'">
        </app-additional-documents>
      </div>
    </p-card>

    <div class="page-actions">
      <button
        (click)="onPrev()"
        class="p-button-text"
        label="{{ 'COMMON.BACK' | translate }}"
        pButton
        type="button">
      </button>

      <button
        (click)="onNext()"
        label="{{ 'COMMON.NEXT' | translate }}"
        pButton
        type="button">
      </button>
    </div>
  </div>
</div>
