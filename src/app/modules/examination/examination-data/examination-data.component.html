<div *ngIf="data" class="grid">
  <div class="col-12">
    <p-card>
      <ng-template pTemplate="title">
        {{ 'MAIN.EXAMINATION.EXAMINATION_DATA.TITLE' | translate }}
      </ng-template>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-4">
          <app-date-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.BEGIN_DATE"
            [value]="data.beginDate"
            (valueChange)="data.beginDate = $event"
            dateFormat="dd.mm.yy"
            [disabled]="patient.declarationId == null">
          </app-date-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.REG_NUMBER"
            [value]="data.regNum"
            (valueChange)="data.regNum = $event"
            [disabled]="patient.declarationId == null">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.ACT_NUMBER"
            [value]="data.actNum"
            (valueChange)="data.actNum = $event"
            [disabled]="patient.declarationId == null">
          </app-text-input-field>
        </div>
      </div>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-4">
          <app-dropdown-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.PLACE_OF_EXAM"
            [options]="dicExamplace"
            optionValue="id"
            optionLabel="nameRu"
            [dictionaryMode]="true"
            [value]="data.placeId"
            (valueChange)="data.placeId = $event"
            [required]="true"
            placeholderKey="COMMON.CHOOSE">
          </app-dropdown-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-dropdown-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.DIS_GROUP"
            [options]="dicGroupDisability"
            optionValue="id"
            optionLabel="nameRu"
            [dictionaryMode]="true"
            [value]="data.disgroupId"
            (valueChange)="data.disgroupId = $event"
            [disabled]="patient.declarationId != null"
            placeholderKey="COMMON.CHOOSE">
          </app-dropdown-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-dropdown-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.DIS_REASON"
            [options]="dicDisabilityReason"
            optionValue="id"
            optionLabel="nameRu"
            [dictionaryMode]="true"
            [value]="data.disreasonId"
            (valueChange)="data.disreasonId = $event"
            [disabled]="patient.declarationId != null"
            styleClass="w-full reason-dropdown"
            panelStyleClass="reason-dropdown-panel"
            placeholderKey="COMMON.CHOOSE">
          </app-dropdown-field>
        </div>
      </div>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.UOT_PREVIOUS"
            [value]="data.uot"
            (valueChange)="data.uot = $event"
            [disabled]="patient.declarationId != null">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.UPT_PREVIOUS"
            [value]="data.upt"
            (valueChange)="data.upt = $event"
            [disabled]="patient.declarationId != null">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-date-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.BEGIN_DATE_PREVIOUS"
            [value]="data.examDate"
            (valueChange)="data.examDate = $event"
            dateFormat="dd.mm.yy"
            [disabled]="patient.declarationId != null">
          </app-date-field>
        </div>
      </div>

      <div class="section-title">
        {{ 'MAIN.EXAMINATION.EXAMINATION_DATA.REGISTRATION.TITLE' | translate }}
      </div>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-6">
          <app-check-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.IS_NOT_HISTORY"
            [checked]="data.isNotHistory"
            (checkedChange)="data.isNotHistory = $event">
          </app-check-field>
        </div>

        <div class="field col-12 md:col-6">
          <app-check-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.IS_REPEAT"
            [checked]="data.isRepeat"
            (checkedChange)="data.isRepeat = $event">
          </app-check-field>
        </div>

        <div class="field col-12 md:col-6">
          <app-check-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.REGISTRATION.MIGRATION"
            [checked]="data.isMigration"
            (checkedChange)="data.isMigration = $event">
          </app-check-field>
        </div>

        <div class="field col-12 md:col-6">
          <app-check-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.REGISTRATION.NAO"
            [checked]="data.isNao"
            (checkedChange)="data.isNao = $event"
            [disabled]="data.isBaikonur">
          </app-check-field>
        </div>

        <div class="field col-12 md:col-6">
          <app-check-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.REGISTRATION.ABROAD"
            [checked]="data.isAbroad"
            (checkedChange)="data.isAbroad = $event">
          </app-check-field>
        </div>

        <div class="field col-12 md:col-6">
          <app-check-field
            labelKey="MAIN.EXAMINATION.EXAMINATION_DATA.REGISTRATION.BAIKONUR"
            [checked]="data.isBaikonur"
            (checkedChange)="data.isBaikonur = $event"
            [disabled]="data.isNao">
          </app-check-field>
        </div>
      </div>
    </p-card>

    <div class="page-actions">
      <button
        (click)="onPrev()"
        class="p-button-text"
        label="{{ 'COMMON.BACK' | translate }}"
        pButton
        type="button">
      </button>

      <button
        (click)="onNext()"
        label="{{ 'COMMON.NEXT' | translate }}"
        pButton
        type="button">
      </button>
    </div>
  </div>
</div>
