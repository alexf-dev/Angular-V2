<div *ngIf="patient" class="grid">
  <div class="col-12">
    <p-card>
      <ng-template pTemplate="title">
        {{ 'MAIN.EXAMINATION.REG_DATA.TITLE' | translate }}
      </ng-template>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.REG_DATA.LASTNAME"
            [value]="patient.personId.surname"
            (valueChange)="patient.personId.surname = $event"
            [readonly]="true">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.REG_DATA.FIRSTNAME"
            [value]="patient.personId.firstName"
            (valueChange)="patient.personId.firstName = $event"
            [readonly]="true">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.REG_DATA.MIDDLENAME"
            [value]="patient.personId.secondName"
            (valueChange)="patient.personId.secondName = $event"
            [readonly]="true">
          </app-text-input-field>
        </div>
      </div>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-4">
          <app-date-field
            labelKey="MAIN.EXAMINATION.REG_DATA.BIRTH_DATE"
            [value]="patient.personId.birthDate"
            (valueChange)="patient.personId.birthDate = $event"
            dateFormat="yy-mm-dd"
            [disabled]="true">
          </app-date-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.REG_DATA.IIN"
            [value]="patient.personId.iin"
            (valueChange)="patient.personId.iin = $event"
            [readonly]="true">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-dropdown-field
            labelKey="MAIN.EXAMINATION.REG_DATA.GENDER"
            [options]="dicGenders"
            optionValue="id"
            optionLabel="nameRu"
            [dictionaryMode]="true"
            [value]="patient.personId.sex.id"
            (valueChange)="patient.personId.sex.id = $event"
            [disabled]="true"
            placeholderKey="COMMON.CHOOSE">
          </app-dropdown-field>
        </div>
      </div>

      <div class="formgrid grid p-fluid">
        <div class="field col-12">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.REG_DATA.CONTACT_DETAILS"
            [value]="patient.phone"
            (valueChange)="patient.phone = $event"
            [readonly]="true">
          </app-text-input-field>
        </div>
      </div>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-6">
          <app-check-field
            labelKey="MAIN.EXAMINATION.REG_DATA.IS_TOWN"
            [checked]="patient.isTown"
            (checkedChange)="patient.isTown = $event">
          </app-check-field>
        </div>
      </div>

      <div class="formgrid grid p-fluid">
        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.REG_DATA.REG_ADDRESS"
            [value]="getAddressString(patient.personId.addresses)"
            [readonly]="true">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-text-input-field
            labelKey="MAIN.EXAMINATION.REG_DATA.ACTUAL_ADDRESS"
            [value]="patient.factAddress"
            (valueChange)="patient.factAddress = $event">
          </app-text-input-field>
        </div>

        <div class="field col-12 md:col-4">
          <app-dropdown-field
            labelKey="MAIN.EXAMINATION.REG_DATA.DIC_ADDRESS"
            [options]="dicDistricts"
            optionValue="id"
            optionLabel="nameRu"
            [dictionaryMode]="true"
            [value]="patient.districtId"
            (valueChange)="patient.districtId = $event"
            [required]="true"
            placeholderKey="COMMON.CHOOSE">
          </app-dropdown-field>
        </div>
      </div>
    </p-card>

    <div class="page-actions">
      <button
        (click)="onNext()"
        label="{{ 'COMMON.NEXT' | translate }}"
        pButton
        type="button">
      </button>
    </div>
  </div>
</div>
